name: Core-RS Image Stitching

on:
  push:
    branches:
      - feature/function-graph-rust-android
    paths:
      - "core-rs/Cargo.toml"
      - "core-rs/Cargo.lock"
      - "core-rs/crates/core-image/**"
      - "core-rs/crates/core-stitch/**"
      - "core-rs/bindings/android/**"
      - "core-rs/bindings/jvm/**"
      - "core-rs/bindings/ffi/**"
      - "shared/src/commonMain/kotlin/com/core/fy/kmp/core/CoreRsPlatform.kt"
      - "shared/src/commonMain/kotlin/com/core/fy/kmp/core/ImageStitchPanel.kt"
      - "shared/src/androidMain/kotlin/com/core/fy/kmp/core/CoreRsPlatform.android.kt"
      - "shared/src/androidMain/kotlin/com/core/fy/kmp/core/ImageStitchPlatform.android.kt"
      - "shared/src/jvmMain/kotlin/com/core/fy/kmp/core/CoreRsPlatform.jvm.kt"
      - "shared/src/jvmMain/kotlin/com/core/fy/kmp/core/ImageStitchPlatform.jvm.kt"
      - "shared/src/jvmMain/kotlin/io/core/rs/CoreRsNative.kt"
      - ".github/workflows/core-rs-image-stitch.yml"
  pull_request:
    paths:
      - "core-rs/Cargo.toml"
      - "core-rs/Cargo.lock"
      - "core-rs/crates/core-image/**"
      - "core-rs/crates/core-stitch/**"
      - "core-rs/bindings/android/**"
      - "core-rs/bindings/jvm/**"
      - "core-rs/bindings/ffi/**"
      - ".github/workflows/core-rs-image-stitch.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-ndk for Android native build
        run: cargo install cargo-ndk --locked
      - name: Test pure Rust image modules
        run: cargo test -p core-image -p core-stitch
      - name: Check Android, JVM and C FFI bindings
        run: cargo check -p core-rs-android -p core-rs-jvm -p core-rs-ffi
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile shared Kotlin targets
        working-directory: .
        run: bash ./gradlew :shared:compileKotlinJvm :shared:compileAndroidMain
