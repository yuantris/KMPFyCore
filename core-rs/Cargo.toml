[workspace]
resolver = "3"
members = [
    "crates/core-common",
    "crates/core-search",
    "crates/core-math",
    "crates/core-binary",
    "bindings/android",
    "tools/core-rs-example",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["core-rs contributors"]

[workspace.dependencies]
core-common = { path = "crates/core-common" }
core-search = { path = "crates/core-search" }
core-math = { path = "crates/core-math" }
core-binary = { path = "crates/core-binary" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "6", default-features = false, features = ["deflate", "bzip2", "zstd"] }
jni = "0.21"
